[package]
name = "libertum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "libertum"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, features = ["advanced", "image-without-codecs", "svg"] }
libertum-layout = { workspace = true }
libertum-model = { workspace = true }
libertum-editor = { workspace = true }
libertum-export = { workspace = true }
libertum-render = { workspace = true }
libertum-docx = { workspace = true }
libertum-odt = { workspace = true }
libertum-markdown = { workspace = true }
libertum-rtf = { workspace = true }
libertum-native = { workspace = true }
libertum-library = { workspace = true }
libertum-diff = { workspace = true }
libertum-html = { workspace = true }
libertum-wiki = { workspace = true }
libertum-audio = { workspace = true }
libertum-formats-common = { workspace = true }
libertum-mcp = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
koto = { workspace = true }
directories = { workspace = true }
spellbook = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }  # the window screenshot hook (src/shot.rs) writes PNGs
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

# Windows only: embeds the logo as the .exe icon (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

# Linux and macOS: lowers the priority of background threads (see src/power.rs). On glibc it also
# caps the malloc arenas at start-up (see `limit_malloc_arenas` in main.rs).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { workspace = true }

# macOS only: sets the Dock icon at startup (see src/macos_icon.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
