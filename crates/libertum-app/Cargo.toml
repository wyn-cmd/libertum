[package]
name = "libertum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "libertum"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, features = ["advanced", "image-without-codecs", "svg"] }
libertum-layout = { workspace = true }
libertum-model = { workspace = true }
libertum-editor = { workspace = true }
libertum-export = { workspace = true }
libertum-render = { workspace = true }
libertum-docx = { workspace = true }
libertum-odt = { workspace = true }
libertum-markdown = { workspace = true }
libertum-rtf = { workspace = true }
libertum-native = { workspace = true }
libertum-library = { workspace = true }
libertum-formats-common = { workspace = true }
libertum-mcp = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
koto = { workspace = true }
directories = { workspace = true }
zspell = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

# Windows only: embeds the logo as the .exe icon (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

# macOS only: sets the Dock icon at startup (see src/macos_icon.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
