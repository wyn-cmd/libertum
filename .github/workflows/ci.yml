name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: cross-built on the Apple Silicon runner; tests run under Rosetta 2.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers libgtk-3-dev
      - name: Install Rosetta 2 (Intel tests on Apple Silicon)
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Clippy (CPU and GPU features)
        run: cargo clippy --workspace --all-targets --all-features
      - name: Test (CPU only)
        run: cargo test --workspace
      # GPU smoke tests skip themselves when the runner has no usable adapter.
      # The log line "adapter:" (or the skip message) shows which case happened.
      - name: Test (GPU feature)
        run: cargo test -p libertum-render --features gpu -- --nocapture
      - name: Build release binary
        run: cargo build --release -p libertum-app
