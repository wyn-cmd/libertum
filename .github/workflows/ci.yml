name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: cross-built on the Apple Silicon runner; tests run under Rosetta 2.
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            # Pinned rather than ubuntu-latest: the .deb records the glibc its binary
            # needs (2.39 on 24.04, which covers Debian 13, Ubuntu 24.04 and Fedora 41
            # and newer). A newer runner would quietly raise that floor.
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          # The package mirrors occasionally fail to resolve on a fresh runner; retry the
          # install rather than failing the build on a transient network error.
          sudo apt-get update
          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends                 pkg-config libxkbcommon-dev libwayland-dev libvulkan1                 mesa-vulkan-drivers libgtk-3-dev                 rpm binutils; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "could not install the Linux system libraries" >&2
          exit 1
      - name: Install Rosetta 2 (Intel tests on Apple Silicon)
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Clippy (CPU and GPU features)
        run: cargo clippy --workspace --all-targets --all-features
      - name: Test (CPU only)
        run: cargo test --workspace
      # GPU smoke tests skip themselves when the runner has no usable adapter.
      # The log line "adapter:" (or the skip message) shows which case happened.
      - name: Test (GPU feature)
        run: cargo test -p libertum-render --features gpu -- --nocapture
      - name: Build release binary
        run: cargo build --release -p libertum-app -p libertum-installer
      # The Windows installer: one .exe carrying the program, install.ps1 and the README
      # (see crates/libertum-installer and packaging/windows/build-installer.ps1).
      - name: Pack the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # The installer is a windowed program: PowerShell only waits for it when told to.
          $pack = Start-Process -FilePath "$release/libertum-installer.exe" -Wait -NoNewWindow -PassThru `
            -ArgumentList 'pack', '--app', "$release/libertum.exe", '--script', 'packaging/windows/install.ps1', `
              '--readme', 'README.md', '--out', 'dist/Libertum-Setup.exe'
          if ($pack.ExitCode -ne 0 -or -not (Test-Path dist/Libertum-Setup.exe)) { throw 'packing the installer failed' }
          Copy-Item "$release/libertum.exe" dist/
          Copy-Item packaging/windows/install.ps1, README.md dist/
      - name: Collect the macOS and Linux binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/libertum" dist/
          cp README.md dist/
      # The Linux packages: a .deb and an .rpm with the binary, desktop entry, icon,
      # MIME entry and documentation (packaging/linux/build-packages.sh).
      - name: Build the Linux packages
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-packages.sh \
            --binary "target/${{ matrix.target }}/release/libertum" --out dist
          dpkg-deb --info dist/libertum_*.deb
          rpm -qp --requires dist/libertum-*.rpm
      # Install both packages and run the executable's dependency check: this is what
      # catches a missing Depends or a file in the wrong place, which the headers cannot.
      - name: Check the Linux packages install
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/libertum_*.deb
          dpkg-query -W -f='${Status}\n' libertum | grep -q 'install ok installed'
          if ldd "$(command -v libertum)" | grep 'not found'; then
            echo "the installed binary is missing shared libraries" >&2
            exit 1
          fi
          test -f /usr/share/applications/libertum.desktop
          test -f /usr/share/mime/packages/libertum.xml
          test -f /usr/share/icons/hicolor/512x512/apps/libertum.png
          sudo dpkg --remove libertum
          # An Ubuntu runner's rpm database does not know the sonames the .rpm requires,
          # so --nodeps only skips dependency resolution; the file list and the
          # scriptlets are still unpacked and run.
          sudo rpm -i --nodeps dist/libertum-*.rpm
          # rpm keeps one database per user (root writes /var/lib/rpm, a normal user
          # ~/.rpmdb), so the query and the removal must run as root too.
          sudo rpm -q libertum
          test -x /usr/bin/libertum
          sudo rpm -e libertum
      # The portable Linux artefact: one AppImage carrying the binary, the libraries it loads
      # and the desktop entry (packaging/linux/build-appimage.sh). linuxdeploy and appimagetool
      # are downloaded by the script; there is no FUSE on the runner, so the script runs them
      # with APPIMAGE_EXTRACT_AND_RUN=1.
      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-appimage.sh \
            --binary "target/${{ matrix.target }}/release/libertum" --out dist
          chmod +x dist/Libertum-*.AppImage
          # Unpacking is the check that the image's layout is complete; running the GUI needs
          # a display.
          ./dist/Libertum-*.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/libertum
          test -f squashfs-root/usr/share/applications/libertum.desktop
          test -n "$(find squashfs-root -name 'libertum.png' -print -quit)"
          rm -rf squashfs-root
      # The macOS bundle: Libertum.app with its icon, Info.plist and document types, packed into
      # a .dmg (packaging/macos/build-app.sh). Signed ad hoc, not notarised.
      - name: Build the macOS app and disk image
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/build-app.sh \
            --binary "target/${{ matrix.target }}/release/libertum" \
            --out dist --arch "${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x64' }}"
          hdiutil verify dist/Libertum-*.dmg
      # Downloadable from the run's summary page for 30 days.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: libertum-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Phase 5's acceptance check, separate from the platform matrix: LibreOffice's own page count
  # for the fixtures and for the generated 343-page acceptance document must be within 2% of
  # Libertum's. The office suite is a large download, so it gets its own job.
  libreoffice-page-counts:
    name: LibreOffice page counts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LibreOffice Writer and poppler
        run: |
          sudo apt-get update
          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends \
                libreoffice-writer-nogui poppler-utils; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "could not install LibreOffice" >&2
          exit 1
      - name: Build the page-count tool and the acceptance document
        run: |
          cargo build --release -p libertum-app --example page_count
          cargo run --release -p libertum-app --example novel_notes_acceptance > /dev/null
      - name: Compare our page counts with LibreOffice's
        run: |
          tools/check-page-counts.sh \
            --page-count target/release/examples/page_count \
            tests/fixtures/odt/rich.odt \
            tests/fixtures/docx/rich.docx \
            tests/fixtures/docx/table.docx \
            target/novel-300.odt \
            target/novel-300.docx

  # Criterion benches for the base and the head commit in one job, so a shared runner's noise
  # is all that separates the two runs. Fork pull requests are skipped: their base commit is
  # not fetched into this repository's origin.
  performance:
    name: Performance regression
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bench the base commit
        run: |
          git worktree add base "${{ github.event.pull_request.base.sha }}"
          (cd base && cargo bench -p libertum-layout --bench pagination -- \
             --save-baseline base --noplot --warm-up-time 1 --measurement-time 3 --sample-size 30)
          (cd base && cargo bench -p libertum-editor --bench editing -- \
             --save-baseline base --noplot --warm-up-time 1 --measurement-time 3 --sample-size 30)
      - name: Bench the head commit
        run: |
          cargo bench -p libertum-layout --bench pagination -- \
            --save-baseline head --noplot --warm-up-time 1 --measurement-time 3 --sample-size 30
          cargo bench -p libertum-editor --bench editing -- \
            --save-baseline head --noplot --warm-up-time 1 --measurement-time 3 --sample-size 30
      # A regression must pass both 10% and 50 us: runner noise must not fail a pull request.
      - name: Compare with the base commit
        run: python3 tools/check-benches.py target/criterion --threshold 10 --floor-us 50
