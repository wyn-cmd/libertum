name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A mistyped tag or a missing notes file must fail before four platform builds start.
  preflight:
    name: Check the tag and the notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check the version and the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag '$TAG' is not v<major>.<minor>.<patch>" >&2; exit 1 ;;
          esac
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$crate_version" != "$version" ]; then
            echo "Cargo.toml says '$crate_version' but the tag says '$version'" >&2
            exit 1
          fi
          notes="docs/RELEASE-${version}.md"
          if [ ! -s "$notes" ]; then
            echo "the release notes file '$notes' is missing or empty" >&2
            exit 1
          fi
          echo "releasing Libertum $version from $GITHUB_SHA"

  build:
    name: ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          for attempt in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends \
                pkg-config libssl-dev libxkbcommon-dev libwayland-dev libvulkan1 \
                mesa-vulkan-drivers libgtk-3-dev rpm binutils; then
              exit 0
            fi
            echo "apt install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: cargo build --release -p libertum-app -p libertum-installer
      - name: Pack the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $pack = Start-Process -FilePath "$release/libertum-installer.exe" -Wait -NoNewWindow -PassThru `
            -ArgumentList 'pack', '--app', "$release/libertum.exe", '--script', 'packaging/windows/install.ps1', `
              '--readme', 'README.md', '--out', 'dist/Libertum-Setup.exe'
          if ($pack.ExitCode -ne 0 -or -not (Test-Path dist/Libertum-Setup.exe)) { throw 'packing the installer failed' }
      - name: Build the Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          bash packaging/linux/build-packages.sh \
            --binary "target/${{ matrix.target }}/release/libertum" --out dist
          bash packaging/linux/build-appimage.sh \
            --binary "target/${{ matrix.target }}/release/libertum" --out dist
      - name: Build the macOS app and disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          bash packaging/macos/build-app.sh \
            --binary "target/${{ matrix.target }}/release/libertum" \
            --out dist --arch "${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x64' }}"
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: libertum-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect, checksum and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p release
          find artifacts -type f \( \
            -name 'Libertum-*.dmg' -o -name 'Libertum-*.zip' -o \
            -name 'Libertum-*.AppImage' -o -name 'libertum_*.deb' -o \
            -name 'libertum-*.rpm' -o -name 'Libertum-Setup*.exe' \
          \) -exec cp -n {} release/ \;
          if [ -f release/Libertum-Setup.exe ]; then
            cp release/Libertum-Setup.exe "release/Libertum-Setup-${version}.exe"
          fi
          # Every platform must have produced what the notes promise before the release
          # page is made; a missing bundle is a failed release, not a smaller one.
          missing=0
          for name in \
            "Libertum-Setup.exe" \
            "Libertum-Setup-${version}.exe" \
            "libertum_${version}_amd64.deb" \
            "libertum-${version}-1.x86_64.rpm" \
            "Libertum-${version}-x86_64.AppImage" \
            "Libertum-${version}-macos-arm64.dmg" \
            "Libertum-${version}-macos-x64.dmg" \
            "Libertum-${version}-macos-arm64.zip" \
            "Libertum-${version}-macos-x64.zip"; do
            if [ ! -f "release/$name" ]; then
              echo "missing release file: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            ls -l release >&2
            exit 1
          fi
          cd release
          # A rerun must not checksum the previous run's SHA256SUMS itself.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          notes="../docs/RELEASE-${version}.md"
          test -s "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "Libertum $TAG" --target "$GITHUB_SHA" --notes-file "$notes"
          fi
          gh release upload "$TAG" ./* --clobber
