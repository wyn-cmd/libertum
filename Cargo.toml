[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
# Internal crates
libertum-model = { path = "crates/libertum-model" }
libertum-layout = { path = "crates/libertum-layout" }
libertum-render = { path = "crates/libertum-render" }
libertum-docx = { path = "crates/libertum-docx" }
libertum-odt = { path = "crates/libertum-odt" }
libertum-rtf = { path = "crates/libertum-rtf" }
libertum-formats-common = { path = "crates/libertum-formats-common" }
libertum-native = { path = "crates/libertum-native" }
libertum-library = { path = "crates/libertum-library" }
libertum-markdown = { path = "crates/libertum-markdown" }
libertum-editor = { path = "crates/libertum-editor" }
libertum-export = { path = "crates/libertum-export" }
libertum-mcp = { path = "crates/libertum-mcp" }
libertum-diff = { path = "crates/libertum-diff" }
libertum-html = { path = "crates/libertum-html" }

# UI
iced = "0.14"
rfd = "0.18"

# Text and rendering
parley = "0.12"
swash = "0.2"
tiny-skia = "0.12"
vello = "0.7"  # 0.7 is the last vello on wgpu 27, which iced_wgpu 0.14 uses (vello 0.11 needs wgpu 30)
unicode-segmentation = "1"
# Text comparison for "compare with last posted" (Apache-2.0, no dependencies with the
# default features). See docs/decisions.md.
similar = "3.2.1"
# Hyphenation (MIT OR Apache-2.0). Only languages whose embedded TeX patterns carry a
# permissive licence are enabled; see docs/third-party-licences.md.
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "english"] }

# Formats
# Pure-Rust deflate only: no C toolchain is needed to cross-check macOS.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
quick-xml = "0.42"
comrak = "0.59"
# HTML import (MIT OR Apache-2.0, with every transitive dependency MIT, Apache-2.0 or
# Unlicense-OR-MIT; checked 2026-11-22). Only the parser: Libertum builds its own tree, so
# markup5ever_rcdom (an unsupported test DOM) and xml5ever are not pulled in.
html5ever = "0.40"
# Decoding and PNG re-encoding of inline images (MIT OR Apache-2.0). Only the codecs the
# formats need; no rayon.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
encoding_rs = "0.8"

# Dates for the date/time fields (MIT OR Apache-2.0). Local time only: no time-zone data.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Data structures and infrastructure
thiserror = "2"
# Build scripts only (Windows): embeds the application icon in the .exe files. MIT.
winresource = { version = "0.1", default-features = false }
# PDF export: printpdf writes the text with embedded/subset fonts; lopdf post-processes
# the archival variant (output intent and XMP). Both MIT.
printpdf = { version = "0.12", default-features = false }
lopdf = "0.44"
# macOS only: the Dock icon (crates/libertum-app/src/macos_icon.rs). MIT.
objc2 = "0.6"
libc = "0.2"  # Linux glibc only: caps malloc arenas at start-up (docs/decisions.md, 2026-11-20)
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"
directories = "6"
# Spellchecking with Hunspell-format dictionaries. Apache-2.0, and the bundled SCOWL
# dictionaries are permissive; see docs/third-party-licences.md and the spell module.
zspell = { version = "0.5.5", features = ["unstable-suggestions"] }

# MCP server (dev mode, docs/mcp-plan.md). rmcp is Apache-2.0; tokio and axum are MIT;
# getrandom is MIT OR Apache-2.0. tokio runs on libertum-mcp's own thread only: the app's
# Iced executor is the thread pool, not tokio.
rmcp = { version = "3.10.0", default-features = false }
tokio = { version = "1.54", default-features = false }
# Recipe scripts (phase 6): koto is MIT. Only its `rc` runtime is used (no serde); the app removes its io, os and koto
# modules and `print` from every script, so a script cannot reach files, programs or the network.
koto = { version = "0.16.1", default-features = false, features = ["rc"] }
axum = { version = "0.8", default-features = false }
getrandom = "0.3"

# Testing
# Plotting, rayon and HTML reports off: text output is enough, and it keeps plotters out of the tree.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

# Vendored for Wayland touchpad pinch zoom: winit 0.30 has no Linux gesture support and
# iced 0.14 does not surface `PinchGesture`. See docs/decisions.md (2026-11-14).
[patch.crates-io]
winit = { path = "vendor/winit" }
iced_winit = { path = "vendor/iced_winit" }
iced_core = { path = "vendor/iced_core" }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep dependencies optimised in dev so text shaping and rasterisation are representative.
[profile.dev.package."*"]
opt-level = 2

# ICU4X prints "ICU4X data error: No segmentation model for complex script" with eprintln!
# for every line-break pass over Chinese or Japanese text when debug assertions are on (a
# release build compiles the message out). Parley is built without its optional
# complex-script dictionaries, so the message is expected and only floods the terminal and
# slows debug builds down. docs/decisions.md, 2026-11-22.
[profile.dev.package.icu_provider]
debug-assertions = false
